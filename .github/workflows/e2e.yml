# Playwright WebGPU smoke tests (tests/e2e). Manual for now, and NOT a merge gate.
#
# Why manual: headless WebGPU on Linux runs on SwiftShader. It was verified 140/140 in the exact
# container below on arm64 (2026-11-02), but it has not yet been run on GitHub's runners.
# Promote to push/pull_request triggers after a few green manual runs (docs/shipping-itch.md).
#
# Keep the container tag in lockstep with the @playwright/test version in package.json.
name: E2E (WebGPU smoke)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # arm64 matches the environment the SwiftShader flags were verified in; Chromium could not
    # be tested on x86_64 locally. Free for public repos.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # GitHub sets CI=true, which turns on retries and the HTML report in playwright.config.ts.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
