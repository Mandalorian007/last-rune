# Gate for main, as three jobs (D-041):
#   engine:     @thunderclap/engine typecheck + lint + unit tests (packages/engine).
#   engine-e2e: engine platform e2e on the harness matrix (D-041 addendum 2).
#   game:       game typecheck + lint + import-boundary check + unit tests, production build, itch zip.
# No secrets are used or needed. Nothing is uploaded to itch.io (see docs/shipping-itch.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + unit tests of packages/engine only.
      - run: pnpm check:engine

  engine-e2e:
    # Engine platform e2e (D-041 addendum 2): the harness smoke on the viewport/device/iframe
    # matrix (packages/engine/playwright.config.ts). Same container and runner as e2e.yml, where
    # SwiftShader WebGPU was verified. Keep the tag in lockstep with @playwright/test.
    name: engine e2e
    # A gate (ws/create-game). Earlier, SwiftShader in this container lost the WebGPU device
    # ("A valid external Instance reference no longer exists") on about 1 test in 8. Re-measured
    # 2026-11-03 in this image on arm64 with CI=1 (1 worker), --repeat-each=3 and no retries:
    # 576 runs, no device loss; 2 fullscreen-watch flakes, since made to poll. CI keeps 1 retry.
    # If device loss comes back on GitHub's runners, restore `continue-on-error: true` here.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      # GitHub sets CI=true: retries and the HTML report (packages/engine/playwright.config.ts).
      - run: pnpm test:e2e:engine

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: engine-e2e-report
          path: |
            packages/engine/playwright-report/
            packages/engine/test-results/
          retention-days: 7

  game:
    # Keeps the pre-split job name so an existing required status check still matches.
    name: check + build + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck (game + the engine sources it imports) + lint + boundary check + game unit tests.
      - run: pnpm check:game

      - run: pnpm build

      # Validates dist/ against itch.io upload rules and writes build/last-rune-itch-<v>.zip.
      - run: pnpm package:itch --skip-build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: itch-zip
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14
