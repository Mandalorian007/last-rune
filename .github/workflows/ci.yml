# Gate for main (D-052: the engine and the desktop shell are npm packages, tested upstream in
# github.com/Mandalorian007/thunderclap-engine, so this repo has no engine jobs):
#   game:       game typecheck + lint + import-boundary check + unit tests, production build.
#   desktop:    unsigned Electron builds of The Last Rune on Linux, macOS and Windows (non-blocking;
#               ws/host-electron, ws/last-rune-desktop).
# No secrets are used or needed. Nothing is uploaded anywhere; Pages deploys from pages.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    # Keeps the pre-split job name so an existing required status check still matches.
    name: check + build + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + boundary check (public package entry points only) + unit tests.
      - run: pnpm check

      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  desktop:
    # Unsigned desktop builds of The Last Rune in the Electron shell (D-042; ws/host-electron,
    # ws/last-rune-desktop, D-052), one per OS, as artefacts. Non-blocking until Gate 4. Build-time
    # downloads only (the Electron and packaging-tool binaries); no signing material is used or
    # needed. The app icon is drawn by scripts/desktop/icon.mjs, the `thunderclap.desktop.prePackage` step.
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web game (dist/), then the desktop app around it in dist/desktop/
      # (the procedural icon, then host-electron's `thunderclap-desktop package` with the
      # `thunderclap.desktop` identity in package.json).
      - run: pnpm build

      - run: pnpm desktop:build ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: the-last-rune-desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 14
