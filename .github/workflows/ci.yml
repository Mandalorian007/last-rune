# Gate for main, as two jobs (D-041):
#   engine: @thunderclap/engine typecheck + lint + unit tests (packages/engine).
#   game:   game typecheck + lint + import-boundary check + unit tests, production build, itch zip.
# No secrets are used or needed. Nothing is uploaded to itch.io (see docs/shipping-itch.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + unit tests of packages/engine only.
      - run: pnpm check:engine

  game:
    # Keeps the pre-split job name so an existing required status check still matches.
    name: check + build + package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck (game + the engine sources it imports) + lint + boundary check + game unit tests.
      - run: pnpm check:game

      - run: pnpm build

      # Validates dist/ against itch.io upload rules and writes build/last-rune-itch-<v>.zip.
      - run: pnpm package:itch --skip-build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: itch-zip
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14
