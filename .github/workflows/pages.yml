# Deploy the production build to GitHub Pages (D-010).
# Manual only: run it from the Actions tab (or `gh workflow run pages.yml`) when a release is cut.
# No secrets; uses the built-in Pages OIDC deploy.
name: Pages

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Release label shown in the build (e.g. alpha-1, v1.0.0)'
        required: true
        default: alpha

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          VITE_RELEASE_LABEL: ${{ inputs.label }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
