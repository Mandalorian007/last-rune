<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>The Last Rune: cover candidates</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1b1f;
        --card: #232328;
        --ink: #e8e2d4;
        --dim: #9a948a;
        --gold: #e0b866;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      header {
        padding: 28px 32px 8px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 26px;
        color: var(--gold);
        letter-spacing: 1px;
      }
      header p {
        margin: 0;
        color: var(--dim);
        max-width: 70ch;
      }
      #status {
        margin-top: 10px;
        color: var(--gold);
      }
      main {
        display: grid;
        gap: 22px;
        padding: 20px 32px 48px;
      }
      .cover {
        display: grid;
        grid-template-columns: 630px auto;
        gap: 22px;
        align-items: start;
        padding: 18px;
        background: var(--card);
        border-radius: 8px;
      }
      .cover canvas.full {
        width: 630px;
        height: 500px;
        display: block;
        border-radius: 4px;
        background: #000;
      }
      .side {
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .side h2 {
        margin: 0;
        font-size: 18px;
      }
      .side h2 span {
        color: var(--gold);
        margin-right: 8px;
      }
      .side p {
        margin: 0;
        color: var(--dim);
        max-width: 40ch;
      }
      .thumb {
        width: 315px;
        height: 250px;
        display: block;
        border-radius: 4px;
        background: #000;
      }
      .thumb-label {
        font-size: 12px;
        color: var(--dim);
      }
      button {
        justify-self: start;
        font: inherit;
        padding: 8px 16px;
        border: 1px solid var(--gold);
        border-radius: 6px;
        background: transparent;
        color: var(--gold);
        cursor: pointer;
      }
      button:hover {
        background: rgba(224, 184, 102, 0.12);
      }
      @media (max-width: 1060px) {
        .cover {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The Last Rune: itch cover candidates</h1>
      <p>
        Eight 630×500 covers, rendered live by the game's own engine and art. Each has a
        315×250 preview at the size itch's browse grid shows it. Download saves the cover as a
        630×500 PNG.
      </p>
      <div id="status">Starting the renderer…</div>
    </header>
    <main id="covers"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
